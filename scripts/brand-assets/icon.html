<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  svg { width: 512px; height: 512px; display: block; }
  /* ?maskable → full-bleed square with the mark inside the 80% safe zone */
  body.maskable { background: #C01530; }
  body.maskable svg { transform: scale(0.78); }
</style>
</head>
<body>
  <svg viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#C01530"/>
    <rect x="4.5" y="4.5" width="55" height="55" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.3"/>
    <text x="32" y="41.5" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="25" letter-spacing="-0.5" fill="#FFFFFF">SY</text>
    <path d="M24 49h16" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <script>if (location.hash === '#maskable') document.body.className = 'maskable';</script>
</body>
</html>
