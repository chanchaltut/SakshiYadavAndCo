<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FBFAF7;
    font-family: Inter, sans-serif;
    color: #0A132B;
    position: relative;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(192,21,48,0.10) 1.4px, transparent 1.4px);
    background-size: 30px 30px;
  }
  .panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 330px;
    background: linear-gradient(135deg, #C01530 0%, #A8102A 55%, #8B0019 100%);
    overflow: hidden;
  }
  .panel .ring { position: absolute; border-radius: 50%; border: 56px solid rgba(255,255,255,0.07); }
  .panel .r1 { width: 380px; height: 380px; right: -140px; top: -120px; }
  .panel .r2 { width: 300px; height: 300px; left: -120px; bottom: -110px; border-width: 44px; }
  .panel .mono {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 210px; letter-spacing: -8px;
    color: #fff; line-height: 1;
  }
  .panel .cap {
    position: absolute; left: 0; right: 0; bottom: 70px; text-align: center;
    color: rgba(255,255,255,0.88); font-size: 13px; font-weight: 800; letter-spacing: 3.4px; text-transform: uppercase;
  }
  .topbar { position: absolute; left: 0; top: 0; right: 330px; height: 8px; background: #C01530; }
  .content { position: absolute; left: 72px; top: 66px; right: 400px; bottom: 60px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 60px; height: 60px; }
  .name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -0.8px; }
  .name span { color: #C01530; }
  .desc { margin-top: 8px; font-size: 12px; font-weight: 800; letter-spacing: 3.8px; color: #C01530; text-transform: uppercase; }
  .badge {
    align-self: flex-start; margin-top: 44px;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(192,21,48,0.28); background: rgba(192,21,48,0.08); color: #C01530; border-radius: 999px;
    padding: 9px 18px; font-size: 13px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: #C01530; }
  h1 {
    margin-top: 22px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
    font-size: 64px; line-height: 1.06; letter-spacing: -2.4px;
  }
  h1 span { display: block; color: #C01530; }
  .services { margin-top: 24px; font-size: 19px; font-weight: 600; color: #667085; }
  .services b { color: #C01530; font-weight: 800; margin: 0 8px; }
  .bar {
    margin-top: auto; display: flex; align-items: center; gap: 30px;
    padding-top: 20px; border-top: 1px solid #EDE7E8;
    font-size: 17px; font-weight: 700; color: #0A132B;
  }
  .bar div { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; background: #C01530; transform: rotate(45deg); flex: none; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="topbar"></div>
  <div class="panel">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="mono">SY</div>
    <div class="cap">Chartered Accountants</div>
  </div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#C01530"/>
        <rect x="4.5" y="4.5" width="55" height="55" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>
        <text x="32" y="41.5" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="25" letter-spacing="-0.5" fill="#FFFFFF">SY</text>
        <path d="M24 49h16" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">Sakshi Yadav <span>&amp;</span> Co.</div>
        <div class="desc">Chartered Accountants</div>
      </div>
    </div>
    <div class="badge"><i></i>ICAI Member Firm · Noida</div>
    <h1>Clarity in tax.<span>Confidence in compliance.</span></h1>
    <div class="services">Income Tax<b>·</b>GST<b>·</b>Audit<b>·</b>Company Law<b>·</b>Advisory</div>
    <div class="bar">
      <div><span class="dot"></span>Sector 18, Noida</div>
      <div><span class="dot"></span>+91 87962 15611</div>
      <div><span class="dot"></span>sakshiyadavandco.in</div>
    </div>
  </div>
</body>
</html>
