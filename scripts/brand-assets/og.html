<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@500;600;700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #08162B;
    font-family: Manrope, sans-serif;
    color: #fff;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(201,164,101,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,164,101,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  .g1 { width: 620px; height: 620px; right: -160px; top: -260px; background: rgba(176,141,87,0.32); }
  .g2 { width: 520px; height: 520px; left: -220px; bottom: -300px; background: rgba(59,77,107,0.55); }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(176,141,87,0.35); border-radius: 22px; }
  .monogram {
    position: absolute; right: 56px; top: 50%; transform: translateY(-54%);
    font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 430px; line-height: 1;
    color: rgba(217,188,133,0.075); letter-spacing: 6px;
  }
  .content { position: absolute; left: 76px; top: 70px; right: 76px; bottom: 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: -0.2px; }
  .name span { color: #D9BC85; }
  .desc { margin-top: 7px; font-size: 12.5px; font-weight: 800; letter-spacing: 4.2px; color: #D9BC85; text-transform: uppercase; }
  h1 {
    margin-top: 56px; font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 86px; line-height: 0.98; letter-spacing: -1px; max-width: 820px;
  }
  h1 em { display: block; font-style: italic; font-weight: 500; color: #D9BC85; }
  .services { margin-top: 30px; font-size: 20px; font-weight: 600; color: #C3CCDA; letter-spacing: 0.2px; }
  .services b { color: #B08D57; font-weight: 800; margin: 0 9px; }
  .bar {
    margin-top: auto; display: flex; align-items: center; gap: 34px;
    padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 18px; font-weight: 600; color: #E3E8F0;
  }
  .bar div { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; background: #B08D57; transform: rotate(45deg); flex: none; }
  .badge {
    position: absolute; right: 76px; top: 78px;
    border: 1px solid rgba(217,188,133,0.55); color: #F4EBD8; border-radius: 999px;
    padding: 10px 20px; font-size: 13px; font-weight: 800; letter-spacing: 2.6px; text-transform: uppercase;
    background: rgba(8,22,43,0.6);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="monogram">SY</div>
  <div class="frame"></div>
  <div class="badge">ICAI Member Firm</div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#0D1F3A"/>
        <rect x="4.5" y="4.5" width="55" height="55" rx="10.5" fill="none" stroke="#B08D57" stroke-opacity="0.8" stroke-width="1.2"/>
        <text x="32" y="42.5" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="29" letter-spacing="0.5" fill="#D9BC85">SY</text>
        <path d="M24 49h16" stroke="#B08D57" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">Sakshi Yadav <span>&amp;</span> Co.</div>
        <div class="desc">Chartered Accountants</div>
      </div>
    </div>
    <h1>Clarity in tax.<em>Confidence in compliance.</em></h1>
    <div class="services">Income Tax<b>·</b>GST<b>·</b>Audit &amp; Assurance<b>·</b>Company Law<b>·</b>Advisory</div>
    <div class="bar">
      <div><span class="dot"></span>Sector 18, Noida</div>
      <div><span class="dot"></span>+91 87962 15611</div>
      <div><span class="dot"></span>sakshiyadavandco.in</div>
    </div>
  </div>
</body>
</html>
