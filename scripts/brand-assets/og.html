<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, sans-serif;
    color: #fff;
    /* same as .bg-night on the site */
    background:
      radial-gradient(900px 600px at 88% -12%, rgba(192,21,48,0.42), transparent 60%),
      radial-gradient(760px 520px at -8% 115%, rgba(192,21,48,0.24), transparent 60%),
      linear-gradient(160deg, #0A132B 0%, #070E21 60%, #040817 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at 60% 50%, #000 25%, transparent 78%);
  }
  .rule { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, #860B1F, #DD5A6F, #860B1F); }

  .content { position: absolute; left: 76px; top: 70px; bottom: 62px; width: 760px; display: flex; flex-direction: column; }
  .lockup { height: 70px; width: auto; align-self: flex-start; }
  .eyebrow {
    align-self: flex-start; margin-top: 50px;
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06);
    border-radius: 999px; padding: 9px 18px 9px 10px;
    font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.9);
  }
  .eyebrow i { width: 22px; height: 22px; border-radius: 50%; background: #C01530; display: inline-flex; align-items: center; justify-content: center; }
  .eyebrow i::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
  h1 {
    margin-top: 22px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
    font-size: 60px; line-height: 1.08; letter-spacing: -2.2px;
  }
  h1 span {
    display: block;
    background: linear-gradient(90deg, #FF7A90 0%, #E2405A 45%, #FF8FA3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .services { margin-top: 26px; font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.68); }
  .services b { color: #EC687C; margin: 0 9px; }
  .bar {
    margin-top: auto; display: flex; align-items: center; gap: 30px;
    padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.9);
  }
  .bar div { display: flex; align-items: center; gap: 10px; }
  .dot { width: 7px; height: 7px; background: #E2405A; transform: rotate(45deg); flex: none; }

  .tile {
    position: absolute; right: 76px; top: 50%; transform: translateY(-50%);
    width: 270px; height: 270px; border-radius: 60px;
    background: #fff; border: 1px solid #EDE7E8;
    display: flex; align-items: center; justify-content: center;
  }
  .tile img { width: 210px; height: 210px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="rule"></div>

  <div class="content">
    <img class="lockup" src="../../public/logo-full-light.webp" alt="">
    <div class="eyebrow"><i></i>ICAI Member Firm · Sector 18, Noida</div>
    <h1>Clarity in tax.<span>Confidence in compliance.</span></h1>
    <div class="services">Income Tax<b>·</b>GST<b>·</b>Audit<b>·</b>ROC<b>·</b>Advisory</div>
    <div class="bar">
      <div><span class="dot"></span>+91 87962 15611</div>
      <div><span class="dot"></span>sakshiyadavandco.in</div>
    </div>
  </div>

  <div class="tile"><img src="../../public/sy-mark.webp" alt=""></div>
</body>
</html>
